<!DOCTYPE html><html lang="en"><head>
    <link rel="icon" type="image/png" href="/logo.png?v=20261026-sitewide1">
    <link rel="apple-touch-icon" href="/logo.png?v=20261026-sitewide1">
<meta name="google-adsense-account" content="ca-pub-2757719583090087"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forgot Password | Decoding HCM</title><link rel="stylesheet" href="css/main.css?v=20261023-motion1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body.recovery-page{min-height:100vh;background:radial-gradient(ellipse at 10% 5%,#e0e7ff 0,transparent 32%),radial-gradient(ellipse at 95% 80%,#cffafe 0,transparent 30%),#f7f9ff;color:#172554}
.recovery-shell{width:min(520px,calc(100% - 28px));margin:clamp(25px,7vh,70px) auto}
.recovery-card{padding:clamp(23px,5vw,38px);border:1px solid #e0e7ff;border-radius:25px;background:#ffffffed;box-shadow:0 22px 60px #1e293b12}
.recovery-mark{display:grid;place-items:center;width:49px;height:49px;margin-bottom:20px;border-radius:15px;background:linear-gradient(140deg,#4f46e5,#9333ea);color:#fff;font-size:1.3rem;font-weight:900;box-shadow:0 9px 20px #4f46e533}
.recovery-card h2{margin:0 0 8px;color:#172554;font-size:clamp(1.65rem,5vw,2rem);letter-spacing:-.04em}
.recovery-card .form-help{color:#64748b;line-height:1.7}
.recovery-card label{display:block;margin:0 0 7px;color:#334155;font-size:.88rem;font-weight:750}
.recovery-card .form-control{width:100%;min-height:48px;padding:11px 13px;border:1px solid #dbe3f0;border-radius:12px;background:#fbfdff}
.recovery-card .form-control:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 4px #6366f11c}
.recovery-card .btn{min-height:46px;border-radius:12px;font-weight:800}
.recovery-card .btn-primary{background:linear-gradient(105deg,#4f46e5,#7c3aed);border:0}
.recovery-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;margin:22px 0 17px;border-radius:13px;background:#f1f5f9}
.recovery-tabs .btn{border:0;background:transparent;color:#64748b}.recovery-tabs .btn-primary{background:#fff;color:#4338ca;box-shadow:0 3px 10px #1e293b12}
.recovery-back{display:inline-flex;margin-top:20px;color:#4f46e5;text-decoration:none;font-weight:800}
@media(max-width:480px){.recovery-shell{margin:16px auto}.recovery-card{border-radius:20px;padding:23px 18px}}
</style></head><body class="recovery-page"><main class="recovery-shell"><section class="card recovery-card"><div class="recovery-mark" aria-hidden="true">↻</div><h2 class="card-title">Reset Password</h2><p class="form-help">Use your verified email or mobile number. Email reset uses a secure reset link. Mobile reset verifies an SMS OTP and then lets you choose a new password.</p><div class="recovery-tabs"><button id="email-tab" type="button" class="btn btn-primary">Email reset</button><button id="phone-tab" type="button" class="btn btn-secondary">Mobile OTP</button></div><div id="email-box"><form id="email-form"><label for="reset-email">Email address</label><input id="reset-email" autocomplete="email" type="email" class="form-control" required placeholder="you@example.com"><button class="btn btn-primary btn-block" style="margin-top:1rem">Send Reset Link</button></form></div><div id="phone-box" style="display:none"><form id="phone-form"><label for="reset-phone">Mobile number</label><input id="reset-phone" autocomplete="tel" type="tel" class="form-control" required placeholder="+91…"><button class="btn btn-primary btn-block" style="margin-top:1rem">Send OTP</button></form><form id="otp-form" style="display:none;margin-top:1rem"><label for="reset-otp">6-digit OTP</label><input id="reset-otp" class="form-control" inputmode="numeric" maxlength="6" placeholder="Enter OTP" required><input id="reset-new-pass" type="password" minlength="8" class="form-control" style="margin-top:.7rem" placeholder="New password" required><input id="reset-confirm-pass" type="password" minlength="8" class="form-control" style="margin-top:.7rem" placeholder="Confirm password" required><button class="btn btn-primary btn-block" style="margin-top:1rem">Verify & Change Password</button></form></div><p id="reset-message" class="form-help" style="margin-top:1rem"></p><a class="recovery-back" href="login.html">← Back to sign in</a></section></main><script src="js/config.js"></script><script src="js/auth.js"></script><script>
const $=id=>document.getElementById(id), msg=$('reset-message');let phone='';$('email-tab').onclick=()=>{$('email-box').style.display='block';$('phone-box').style.display='none';};$('phone-tab').onclick=()=>{$('email-box').style.display='none';$('phone-box').style.display='block';};$('email-form').onsubmit=async e=>{e.preventDefault();try{const {error}=await supabaseClient.auth.resetPasswordForEmail($('reset-email').value.trim().toLowerCase(),{redirectTo:'https://decoding-hcm.vercel.app/reset.html'});if(error)throw error;msg.textContent='Reset link sent. Check your email.';}catch(err){msg.textContent=err.message;}};$('phone-form').onsubmit=async e=>{e.preventDefault();phone=$('reset-phone').value.trim();try{await AuthManager.sendPhoneOtp(phone);$('phone-form').style.display='none';$('otp-form').style.display='block';msg.textContent='OTP sent.';}catch(err){msg.textContent=err.message;}};$('otp-form').onsubmit=async e=>{e.preventDefault();if($('reset-new-pass').value!==$('reset-confirm-pass').value){msg.textContent='Passwords do not match.';return;}try{await AuthManager.verifyPhoneOtp(phone,$('reset-otp').value);await AuthManager.changePassword($('reset-new-pass').value);msg.textContent='Password changed. You can now sign in.';setTimeout(()=>location.href='login.html',1200);}catch(err){msg.textContent=err.message;}};
</script></body></html>
