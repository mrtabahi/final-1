<!DOCTYPE html><html lang="en"><head><meta name="google-adsense-account" content="ca-pub-2757719583090087"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forgot Password | Decoding HCM</title><link rel="stylesheet" href="css/main.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="container" style="max-width:560px;margin:3rem auto"><div class="card"><h2 class="card-title">Reset Password</h2><p class="form-help">Use your verified email or mobile number. Email reset uses a secure reset link. Mobile reset verifies an SMS OTP and then lets you choose a new password.</p><div style="display:flex;gap:.5rem;margin-bottom:1rem"><button id="email-tab" class="btn btn-primary">Email</button><button id="phone-tab" class="btn btn-secondary">Mobile</button></div><div id="email-box"><form id="email-form"><input id="reset-email" type="email" class="form-control" required placeholder="name@gmail.com"><button class="btn btn-primary btn-block" style="margin-top:1rem">Send Reset Link</button></form></div><div id="phone-box" style="display:none"><form id="phone-form"><input id="reset-phone" type="tel" class="form-control" required placeholder="+91XXXXXXXXXX"><button class="btn btn-primary btn-block" style="margin-top:1rem">Send OTP</button></form><form id="otp-form" style="display:none;margin-top:1rem"><input id="reset-otp" class="form-control" inputmode="numeric" maxlength="6" placeholder="6-digit OTP" required><input id="reset-new-pass" type="password" minlength="8" class="form-control" style="margin-top:.7rem" placeholder="New password" required><input id="reset-confirm-pass" type="password" minlength="8" class="form-control" style="margin-top:.7rem" placeholder="Confirm password" required><button class="btn btn-primary btn-block" style="margin-top:1rem">Verify & Change Password</button></form></div><p id="reset-message" class="form-help" style="margin-top:1rem"></p><a href="login.html">Back to Sign In</a></div></div><script src="js/config.js"></script><script src="js/auth.js"></script><script>
const $=id=>document.getElementById(id), msg=$('reset-message');let phone='';$('email-tab').onclick=()=>{$('email-box').style.display='block';$('phone-box').style.display='none';};$('phone-tab').onclick=()=>{$('email-box').style.display='none';$('phone-box').style.display='block';};$('email-form').onsubmit=async e=>{e.preventDefault();try{const {error}=await supabaseClient.auth.resetPasswordForEmail($('reset-email').value.trim().toLowerCase(),{redirectTo:`${location.origin}/reset.html`});if(error)throw error;msg.textContent='Reset link sent. Check your email.';}catch(err){msg.textContent=err.message;}};$('phone-form').onsubmit=async e=>{e.preventDefault();phone=$('reset-phone').value.trim();try{await AuthManager.sendPhoneOtp(phone);$('phone-form').style.display='none';$('otp-form').style.display='block';msg.textContent='OTP sent.';}catch(err){msg.textContent=err.message;}};$('otp-form').onsubmit=async e=>{e.preventDefault();if($('reset-new-pass').value!==$('reset-confirm-pass').value){msg.textContent='Passwords do not match.';return;}try{await AuthManager.verifyPhoneOtp(phone,$('reset-otp').value);await AuthManager.changePassword($('reset-new-pass').value);msg.textContent='Password changed. You can now sign in.';setTimeout(()=>location.href='login.html',1200);}catch(err){msg.textContent=err.message;}};
</script></body></html>
