<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png?v=20261027-auth"><link rel="apple-touch-icon" href="/logo.png?v=20261027-auth">
<title>Forgot Password | Decoding HCM</title><link rel="stylesheet" href="css/main.css?v=20261029-premium1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body.recovery-page{min-height:100vh;background:radial-gradient(ellipse at 8% 4%,#e0e7ff 0,transparent 32%),radial-gradient(ellipse at 95% 80%,#cffafe 0,transparent 30%),#f7f9ff;color:#172554}
.recovery-shell{width:min(520px,calc(100% - 28px));margin:clamp(25px,8vh,80px) auto}
.recovery-card{padding:clamp(24px,5vw,40px);border:1px solid #e0e7ff;border-radius:25px;background:#ffffffed;box-shadow:0 22px 60px #1e293b12}
.recovery-mark{display:grid;place-items:center;width:50px;height:50px;margin-bottom:20px;border-radius:15px;background:linear-gradient(140deg,#4f46e5,#9333ea);color:#fff;font-size:1.35rem;font-weight:900;box-shadow:0 9px 20px #4f46e533}
.recovery-card h1{margin:0 0 9px;color:#172554;font-size:clamp(1.65rem,5vw,2rem);letter-spacing:-.04em}
.recovery-card .help{color:#64748b;line-height:1.7;margin:0 0 24px}
.recovery-card label{display:block;margin:0 0 7px;color:#334155;font-size:.88rem;font-weight:750}
.recovery-card input{width:100%;min-height:49px;padding:12px 14px;border:1px solid #dbe3f0;border-radius:12px;background:#fbfdff;color:#0f172a}
.recovery-card input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 4px #6366f11c}
.recovery-card button{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:12px;background:linear-gradient(105deg,#4f46e5,#7c3aed);color:white;font-weight:800;cursor:pointer}
.recovery-card button:disabled{opacity:.6;cursor:wait}
#reset-message{margin:14px 0 0;color:#475569;line-height:1.6;overflow-wrap:anywhere}
.recovery-back{display:inline-flex;margin-top:21px;color:#4f46e5;text-decoration:none;font-weight:800}
@media(max-width:480px){.recovery-shell{margin:16px auto}.recovery-card{border-radius:20px;padding:24px 18px}}
</style></head>
<body class="recovery-page"><main class="recovery-shell"><section class="card recovery-card">
<div class="recovery-mark" aria-hidden="true">↻</div><h1>Forgot your password?</h1>
<p class="help">Enter the email address you registered with. We’ll send a secure link where you can create and confirm a new password. No OTP is needed.</p>
<form id="email-form"><label for="reset-email">Email address</label><input id="reset-email" autocomplete="email" type="email" required placeholder="you@example.com"><button id="send-reset" type="submit">Send password reset link</button></form>
<p id="reset-message" role="status" aria-live="polite"></p><a class="recovery-back" href="login.html">← Back to sign in</a>
</section></main><script src="js/config.js"></script><script>
const form=document.getElementById('email-form'),email=document.getElementById('reset-email'),button=document.getElementById('send-reset'),message=document.getElementById('reset-message');
form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';if(!supabaseClient){message.textContent='Authentication could not load. Refresh and try again.';return;}button.disabled=true;button.textContent='Sending secure link…';try{const {error}=await supabaseClient.auth.resetPasswordForEmail(email.value.trim().toLowerCase(),{redirectTo:new URL('/reset.html',window.location.origin).toString()});if(error)throw error;message.textContent='If this email is registered, a password reset link has been sent. Check your Inbox and Spam folders.';form.reset();}catch(error){message.textContent=error.message||'Could not request a reset link. Please try again later.';}finally{button.disabled=false;button.textContent='Send password reset link';}});
</script></body></html>
