<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/logo.png?v=20261026-branding2">
<link rel="apple-touch-icon" href="/logo.png?v=20261026-branding2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose New Password | Decoding HCM</title>
  <link rel="stylesheet" href="css/main.css?v=20261023-password-reset">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body.password-update-page{min-height:100vh;background:radial-gradient(ellipse at 8% 4%,#e0e7ff 0,transparent 32%),radial-gradient(ellipse at 95% 80%,#cffafe 0,transparent 30%),#f7f9ff;color:#172554}
.password-update-shell{width:min(520px,calc(100% - 28px));margin:clamp(25px,8vh,80px) auto}
.password-update-card{padding:clamp(24px,5vw,40px);border:1px solid #e0e7ff;border-radius:25px;background:#ffffffed;box-shadow:0 22px 60px #1e293b12}
.password-update-mark{display:grid;place-items:center;width:50px;height:50px;margin-bottom:20px;border-radius:15px;background:linear-gradient(140deg,#4f46e5,#9333ea);color:#fff;font-size:1.3rem;font-weight:900;box-shadow:0 9px 20px #4f46e533}
.password-update-card h1{margin:0 0 9px;color:#172554;font-size:clamp(1.65rem,5vw,2rem);letter-spacing:-.04em}
.password-update-card .help{color:#64748b;line-height:1.7}
.password-update-card label{display:block;margin:0 0 7px;color:#334155;font-size:.88rem;font-weight:750}
.password-update-card input{width:100%;min-height:49px;padding:12px 14px;border:1px solid #dbe3f0;border-radius:12px;background:#fbfdff;color:#0f172a}
.password-update-card input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 4px #6366f11c}
.password-update-card .btn{min-height:48px;margin-top:12px;border-radius:12px;font-weight:800;background:linear-gradient(105deg,#4f46e5,#7c3aed);border:0}
.password-update-card .btn:disabled{opacity:.6;cursor:wait}
.password-update-card #reset-status{margin:14px 0 0;color:#475569;line-height:1.6;overflow-wrap:anywhere}
.password-update-back{display:inline-flex;margin-top:21px;color:#4f46e5;text-decoration:none;font-weight:800}
@media(max-width:480px){.password-update-shell{margin:16px auto}.password-update-card{border-radius:20px;padding:24px 18px}}
</style></head>
<body>
  <div class="container" style="max-width:560px;margin:3rem auto">
    <div class="card">
      <h2 class="card-title">Choose a New Password</h2>
      <p class="form-help">Open this page using the password-reset link sent to your email.</p>
      
      <form id="new-password-form">
        <div class="form-group"><label class="form-label" for="new-password">New password</label><input id="new-password" type="password" class="form-control" minlength="8" autocomplete="new-password" required></div>
        <div class="form-group"><label class="form-label" for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" class="form-control" minlength="8" autocomplete="new-password" required></div>
        <button id="save-password" class="btn btn-primary btn-block" style="margin-top:1rem">Update Password</button>
      </form>
      <p id="reset-status" class="form-help" role="status" style="margin-top:1rem"></p>
      <a href="login.html">Back to Sign In</a>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script>
    const form = document.getElementById('new-password-form');
    const status = document.getElementById('reset-status');
    const submit = document.getElementById('save-password');
    let recoveryReady = false;
    const showError = message => { status.textContent = message; };
    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || (session && session.user)) {
          recoveryReady = true;
          status.textContent = 'Reset link verified. You can set your new password.';
        }
      });
      supabaseClient.auth.getSession().then(({data, error}) => {
        if (error) showError(error.message);
        if (data && data.session) {
          recoveryReady = true;
          status.textContent = 'Reset link verified. You can set your new password.';
        }
      });
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      status.textContent = '';
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (password.length < 8) return showError('Password must be at least 8 characters.');
      if (password !== confirm) return showError('Passwords do not match.');
      if (!supabaseClient) return showError('Authentication could not load. Refresh and try again.');
      submit.disabled = true;
      try {
        const {data, error: sessionError} = await supabaseClient.auth.getSession();
        if (sessionError) throw sessionError;
        if (!recoveryReady && !data.session) throw new Error('This reset link is invalid or expired. Request a new password reset email.');
        const {error} = await supabaseClient.auth.updateUser({password});
        if (error) throw error;
        status.textContent = 'Password updated successfully. Redirecting to sign in…';
        form.reset();
        await supabaseClient.auth.signOut();
        setTimeout(() => { window.location.href = 'login.html?passwordReset=success'; }, 1200);
      } catch (error) {
        showError(error.message || 'Could not update password. Request a new reset link and try again.');
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
