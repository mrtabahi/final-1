<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Set New Password | Decoding HCM</title><link rel="stylesheet" href="css/main.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="container" style="max-width:500px;margin:3rem auto"><div class="card"><h2 class="card-title">Set New Password</h2><form id="reset-form"><input id="pass1" type="password" minlength="8" class="form-control" required placeholder="New password"><input id="pass2" type="password" minlength="8" class="form-control" required placeholder="Confirm password" style="margin-top:.8rem"><button class="btn btn-primary btn-block" style="margin-top:1rem">Change Password</button></form><p id="msg" class="form-help"></p></div></div><script src="js/config.js"></script><script>document.getElementById('reset-form').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');if(pass1.value!==pass2.value){m.textContent='Passwords do not match.';return;}const {error}=await supabaseClient.auth.updateUser({password:pass1.value});m.textContent=error?error.message:'Password changed successfully.';if(!error)setTimeout(()=>location.href='login.html',1000);};</script></body></html>
