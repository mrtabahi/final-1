name: Security regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/anon-execute-privileged-rpcs]

permissions:
  contents: read

jobs:
  privileged-rpc-grants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test privileged RPC grants migration
        run: node --test tests/privileged-rpc-grants-regression.test.cjs
      - name: Test compact credential-only login page
        run: node --test tests/login-page-regression.test.cjs
      - name: Check admin command center JavaScript syntax
        run: node --check js/admin-command-center.js
      - name: Test admin command center wiring
        run: node --test tests/admin-command-center-regression.test.cjs
      - name: Check subscription UI JavaScript syntax
        run: node --check js/admin-subscriptions.js && node --check js/premium.js && node --check js/my-subscription.js
      - name: Test subscription control center wiring
        run: node --test tests/subscription-control-center-regression.test.cjs
      - name: Check feature access and admin membership JavaScript syntax
        run: node --check js/feature-access.js && node --check js/test-list.js && node --check js/materials.js
      - name: Test admin feature access controls
        run: node --test tests/admin-feature-access-regression.test.cjs
