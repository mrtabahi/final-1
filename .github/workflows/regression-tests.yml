name: Regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  node-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check monetization browser script syntax
        run: |
          for file in js/admin-access.js js/admin-plans.js js/admin-payments.js js/admin-entitlements.js js/admin-subscriptions.js js/my-subscription.js; do
            node --check "$file"
          done
      - name: Run regression tests
        run: node --test tests/*.test.cjs
