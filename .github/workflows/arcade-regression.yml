name: Arcade regression tests

on:
  pull_request:
    paths:
      - 'speed-sprint.html'
      - 'word-accuracy.html'
      - 'time-attack.html'
      - 'js/arcade/**'
      - 'supabase/functions/typing-result/typing-master.js'
      - 'tests/typing-arcade-games-regression.test.cjs'
      - 'tests/typing-arcade-distinct.test.cjs'
      - '.github/workflows/arcade-regression.yml'

permissions:
  contents: read

jobs:
  arcade-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Node.js
        run: node --version
      - name: Run arcade regression tests
        run: node --test tests/typing-arcade-games-regression.test.cjs tests/typing-arcade-distinct.test.cjs
