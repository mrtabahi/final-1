<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verification | Decoding HCM</title><link rel="stylesheet" href="css/main.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="container" style="max-width:560px;margin:3rem auto"><div class="card"><h2 class="card-title">Complete Account Verification</h2><p id="email-status" class="form-help"></p><div id="phone-step"><h3>Mobile Verification</h3><p class="form-help">A verified mobile number is required before a typing test can be attempted.</p><input id="phone" type="tel" class="form-control" placeholder="+91XXXXXXXXXX"><button id="send" class="btn btn-primary btn-block" style="margin-top:1rem">Send OTP</button><div id="otp-area" style="display:none;margin-top:1rem"><input id="otp" class="form-control" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button id="verify" class="btn btn-primary btn-block" style="margin-top:1rem">Verify Mobile</button></div></div><p id="msg" class="form-help" style="margin-top:1rem"></p><a href="login.html">Back to Sign In</a></div></div><script src="js/config.js"></script><script src="js/auth.js"></script><script>
(async()=>{const user=await AuthManager.getUser();if(!user){location.href='login.html';return;}document.getElementById('email-status').textContent=user.email_confirmed_at?'Email verified ✓':'Please confirm the verification email first, then return and sign in again.';const p=await AuthManager.getProfile();document.getElementById('phone').value=p?.phone||user.phone||'';if(p?.phone_verified){location.href='dashboard.html';}})();
const $=id=>document.getElementById(id);$('send').onclick=async()=>{try{const phone=$('phone').value.trim();if(!phone)throw new Error('Enter your mobile number.');await AuthManager.attachAndVerifyPhone(phone);await AuthManager.sendPhoneOtp(phone);$('otp-area').style.display='block';$('msg').textContent='OTP sent.';}catch(e){$('msg').textContent=e.message;}};$('verify').onclick=async()=>{try{await AuthManager.verifyPhoneOtp($('phone').value,$('otp').value);location.href='dashboard.html';}catch(e){$('msg').textContent=e.message;}};
</script></body></html>
